name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  FRONTEND_SERVICE_NAME: ${{ vars.FRONTEND_CLOUDRUN_SERVICE }}
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build frontend static files
        run: npm ci && npm run build

      - name: Build Docker image
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY/$FRONTEND_SERVICE_NAME-frontend"
          gcloud builds submit --tag $IMAGE_URI

      - name: Deploy to Cloud Run (Frontend)
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY/$FRONTEND_SERVICE_NAME-frontend"
          gcloud run deploy $FRONTEND_SERVICE_NAME-frontend \
            --image $IMAGE_URI \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated

      - name: Notify deployment success
        run: |
          echo "Deployment to Cloud Run (Frontend) completed successfully." 
          # Optionally, you can send a notification to Slack, email, etc.
          # For example, using curl to send a message to a Slack webhook:
          # curl -X POST -H 'Content-type: application/json' --data '{"text":"Deployment to Cloud Run (Frontend) completed successfully."}' ${{ secrets.SLACK_WEBHOOK_URL }}
