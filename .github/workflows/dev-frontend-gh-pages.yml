name: Deploy Dev Frontend to GitHub Pages

on:
  push:
    branches:
      - feature/develop/frontend-dev
    paths:
      - 'dev-frontend/**'
      - '.github/workflows/dev-frontend-gh-pages.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install
        working-directory: dev-frontend

      - name: Build
        run: pnpm build
        working-directory: dev-frontend

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dev-frontend/dist
          publish_branch: gh-pages
