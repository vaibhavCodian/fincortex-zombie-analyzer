name: Cloud Run Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'services/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'services/backend/**'
      - '.github/workflows/backend.yml'

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  SERVICE_NAME: ${{ vars.BACKEND_CLOUDRUN_SERVICE }}
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Docker image
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY/$SERVICE_NAME-backend"
          gcloud builds submit --tag $IMAGE_URI

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URI="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY/$SERVICE_NAME-backend"
          gcloud run deploy $SERVICE_NAME-backend \
            --image $IMAGE_URI \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated